<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aria</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
        <div class="logo-name">Aria</div>
      </div>
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search-input" type="text" placeholder="Search songs, artists, albums" autocomplete="off" spellcheck="false">
      </div>
      <nav class="nav-section">
        <div class="nav-title">Library</div>
        <button class="nav-item" id="nav-liked">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span class="nav-label">Liked Songs</span>
          <span class="nav-count" id="liked-count"></span>
        </button>
      </nav>
      <nav class="nav-section nav-grow">
        <div class="nav-title-row">
          <div class="nav-title">Playlists</div>
          <button id="btn-new-playlist" class="plus-btn" aria-label="New playlist">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
        <div id="playlist-items"></div>
      </nav>
      <div class="sidebar-foot">320 kbps &middot; Apple-style lyrics</div>
    </aside>

    <main class="main">
      <header class="page-head">
        <h1 id="page-title">Search</h1>
        <p id="page-sub">Find songs, artists and albums</p>
      </header>
      <div id="error" class="error hidden"></div>
      <div id="results"></div>
    </main>

    <footer class="player">
      <div class="np">
        <div class="np-art-wrap">
          <div class="np-art-fallback">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          </div>
          <img id="np-art" alt="">
        </div>
        <div class="np-meta">
          <h4><span id="np-title">Not Playing</span><span id="np-badge" class="badge hidden">320</span></h4>
          <p id="np-artist">Pick a song to start listening</p>
        </div>
        <button id="btn-like" class="t-btn" aria-label="Like">
          <svg id="icon-heart-o" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <svg id="icon-heart-f" class="hidden" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
      </div>
      <div class="controls">
        <div class="transport">
          <button id="btn-shuffle" class="t-btn" aria-label="Shuffle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
          </button>
          <button id="btn-prev" class="t-btn" aria-label="Previous">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
          </button>
          <button id="btn-play" class="t-btn play" aria-label="Play or pause">
            <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
            <svg id="icon-pause" class="hidden" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          </button>
          <button id="btn-next" class="t-btn" aria-label="Next">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
          </button>
          <button id="btn-repeat" class="t-btn" aria-label="Repeat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          </button>
        </div>
        <div class="seek">
          <span class="time" id="time-cur">0:00</span>
          <input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Seek">
          <span class="time" id="time-dur">0:00</span>
        </div>
      </div>
      <div class="volume">
        <button id="btn-lyrics" class="t-btn" aria-label="Lyrics">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M10.2 5.5H6.9A2.9 2.9 0 0 0 4 8.4v3.2a2.9 2.9 0 0 0 2.9 2.9h1.6a6.6 6.6 0 0 1-3.5 4.3.8.8 0 0 0 .5 1.5 8.6 8.6 0 0 0 4.7-7.9V5.5z"/><path d="M20 5.5h-3.3a2.9 2.9 0 0 0-2.9 2.9v3.2a2.9 2.9 0 0 0 2.9 2.9h1.6a6.6 6.6 0 0 1-3.5 4.3.8.8 0 0 0 .5 1.5 8.6 8.6 0 0 0 4.7-7.9V5.5z"/></svg>
        </button>
        <button id="btn-vol" class="t-btn" aria-label="Mute">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </button>
        <input id="volume" type="range" min="0" max="100" value="80" aria-label="Volume">
      </div>
    </footer>

    <section id="lyrics-view" class="lyrics-view" aria-hidden="true">
      <div class="lyrics-bg" id="lyrics-bg"></div>
      <div class="lyrics-top">
        <button id="lyrics-close" class="t-btn" aria-label="Close lyrics">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="lyrics-head">
          <h2 id="lyrics-title"></h2>
          <p id="lyrics-artist"></p>
        </div>
      </div>
      <am-lyrics id="am-lyrics" autoscroll interpolate highlight-color="#ffffff"></am-lyrics>
      <div id="lyrics-empty" class="lyrics-empty hidden">No lyrics available</div>
    </section>
  </div>

  <script type="module" src="https://cdn.jsdelivr.net/npm/@uimaxbai/am-lyrics@1.7.4/dist/src/am-lyrics.min.js"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
